<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0F1D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Wonderdraw — 1 000 Topic Lottery & 60s Challenge</title>
  <meta name="title" content="Wonderdraw — 1 000 Topic Lottery & 60s Challenge">
  <meta name="description" content="Tirez au sort parmi 1 000 sujets répertoriés, affûtez votre angle et préparez votre explication en 1 minute.">

  <!-- Open Graph / Facebook / WhatsApp / LinkedIn / Discord -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://raw-red.vercel.app/">
  <meta property="og:site_name" content="Wonderdraw">
  <meta property="og:title" content="Wonderdraw — 1 000 Topic Lottery & 60s Challenge">
  <meta property="og:description" content="Tirez au sort parmi 1 000 sujets répertoriés, affûtez votre angle et préparez votre explication en 1 minute.">
  <meta property="og:image" content="https://raw-red.vercel.app/og-image.jpg">
  <meta property="og:image:secure_url" content="https://raw-red.vercel.app/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1024">
  <meta property="og:image:alt" content="Wonderdraw — 1 000 Topic Lottery">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://raw-red.vercel.app/">
  <meta name="twitter:title" content="Wonderdraw — 1 000 Topic Lottery & 60s Challenge">
  <meta name="twitter:description" content="Tirez au sort parmi 1 000 sujets répertoriés, affûtez votre angle et préparez votre explication en 1 minute.">
  <meta name="twitter:image" content="https://raw-red.vercel.app/og-image.jpg">
  <meta name="twitter:image:alt" content="Wonderdraw — 1 000 Topic Lottery">

  <!-- Favicon & Touch Icon -->
  <link rel="icon" type="image/jpeg" href="/og-image.jpg">
  <link rel="apple-touch-icon" href="/og-image.jpg">
  <link rel="image_src" href="/og-image.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <!-- Ambient Background Mesh -->
  <div class="ambient-glow-container">
    <div class="ambient-glow-orb ambient-orb-1"></div>
    <div class="ambient-glow-orb ambient-orb-2"></div>
    <div class="ambient-glow-orb ambient-orb-3"></div>
  </div>

  <div id="app">
    <!-- Header Navigation -->
    <header class="app-header">
      <div class="brand-section" id="brandHomeBtn">
        <div class="brand-logo-gem" id="brandLogoContainer"></div>
        <h1 class="brand-title">Wonderdraw</h1>
      </div>

      <!-- Main Navigation Tabs -->
      <nav class="nav-pills">
        <button class="nav-pill-btn active" data-tab="draw" id="tabBtnDraw">
          <span class="nav-icon" id="iconTabDraw"></span>
          <span id="labelTabDraw">Tirage</span>
        </button>
        <button class="nav-pill-btn" data-tab="studio" id="tabBtnStudio">
          <span class="nav-icon" id="iconTabStudio"></span>
          <span id="labelTabStudio">Chronos</span>
        </button>
        <button class="nav-pill-btn" data-tab="stats" id="tabBtnStats">
          <span class="nav-icon" id="iconTabStats"></span>
          <span id="labelTabStats">Progression</span>
        </button>
      </nav>

      <!-- Utility Actions -->
      <div class="header-actions">
        <div class="deck-counter-badge" id="headerDeckBadge" title="Sujets disponibles dans la pioche">
          <span id="deckBadgeIcon"></span>
          <span id="headerDeckCount">1000/1000</span>
        </div>

        <!-- Language Switcher (EN / FR) -->
        <button class="action-icon-btn" id="langToggleBtn" title="Changer de langue / Switch language" style="width:auto; padding:0 0.65rem; font-family:var(--font-sans); font-size:0.78rem; font-weight:700; letter-spacing:0.04em;">
          <span id="langBtnLabel">EN</span>
        </button>

        <button class="action-icon-btn" id="audioToggleBtn" title="Activer / Couper les effets sonores"></button>
      </div>
    </header>

    <!-- Active Views -->
    <main>
      <section id="drawView" class="tab-view active"></section>
      <section id="studioView" class="tab-view"></section>
      <section id="statsView" class="tab-view"></section>
    </main>
  </div>

  <!-- Themes Filter Modal -->
  <div class="modal-backdrop" id="themeModal">
    <div class="modal-card" style="max-width: 560px; max-height: 85vh; display: flex; flex-direction: column;">
      <div class="modal-header">
        <div>
          <h3 id="themeModalTitle">Filtrer par Thème</h3>
          <p id="themeModalSub" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem;">
            Choisissez une catégorie spécifique pour le tirage ou sélectionnez tous les thèmes.
          </p>
        </div>
        <button class="modal-close-btn" id="closeThemeModalBtn"></button>
      </div>
      <div class="theme-options-list" id="themeOptionsContainer">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
